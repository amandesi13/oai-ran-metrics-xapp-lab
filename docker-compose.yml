services:
  ran-source:
    build: .
    command: ["oai-ran-source"]
    environment:
      PORT: "8000"
      RAN_SIM_SEED: "42"
    ports:
      - "8100:8000"

  xapp:
    build: .
    command: ["oai-ran-xapp"]
    environment:
      PORT: "8001"
      RAN_SOURCE_URL: "http://ran-source:8000/ran-metrics"
      POLL_INTERVAL_SECONDS: "2"
      RAN_SCENARIO: "congestion"
    depends_on:
      - ran-source
    ports:
      - "8101:8001"

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - xapp
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
